<title>WhatIf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<style>
/* ================================================= WhatIf — "Black glass"
   True black. One cool sliver of light. Huge type. Massive space.
   Motion stays silent until it matters. The faces are the only content. */
:root{
  --black:#000; --char:#0A0B0D; --char2:#141619; --char3:#1c1f24;
  --glass:rgba(255,255,255,.05); --glass2:rgba(255,255,255,.08);
  --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.16);
  --spec:rgba(255,255,255,.45);
  --tx:#fff; --tx2:rgba(255,255,255,.62); --tx3:rgba(255,255,255,.34);
  --live:#FF453A;
  --sig:#9CC4FF;                 /* the single cool signal light */
  --sig-glow:rgba(120,175,255,.55);
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --font:-apple-system,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#050506;color:var(--tx);display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

/* device */
.device{position:relative;width:min(100vw,412px);height:min(100dvh,892px);background:var(--black);overflow:hidden}
@media(min-width:520px) and (min-height:920px){
  .device{border-radius:54px;border:1px solid rgba(255,255,255,.07);
    box-shadow:0 50px 140px -30px #000, 0 0 0 10px #0a0a0c}
}

/* screens */
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.screen.on{opacity:1;pointer-events:auto}
.pad{padding:0 26px}
.safe-t{padding-top:max(env(safe-area-inset-top),18px)}
.safe-b{padding-bottom:max(env(safe-area-inset-bottom),20px)}

/* type */
.mark{font-weight:700;letter-spacing:-.02em;font-size:17px}
.mark b{font-weight:800}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3)}
.huge{font-weight:800;letter-spacing:-.03em;line-height:1.02}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.sub{font-size:15px;color:var(--tx2);font-weight:500;letter-spacing:-.01em}
.tiny{font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:.02em}

.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between}
.livecount{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--tx2)}
.livecount .d{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live)}

/* ============ HOME ============ */
#home{display:flex;flex-direction:column}
#selfHome{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--char)}
#selfHome video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:saturate(1.05) contrast(1.02) brightness(.92)}
/* dark grade so type reads + faces stay premium */
#selfHome .grade{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 12%, transparent 40%, rgba(0,0,0,.55) 100%),
  linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.15) 30%, rgba(0,0,0,.75))}
.home-body{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}

.play{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.play .glow{position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle, var(--sig-glow), transparent 62%);
  animation:breathe 3.6s ease-in-out infinite;filter:blur(2px)}
.play .disc{position:relative;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(140% 140% at 35% 25%, rgba(255,255,255,.22), rgba(255,255,255,.04) 45%, rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;box-shadow:0 20px 60px -20px #000, inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .4s var(--spring)}
.play:active .disc{transform:scale(.9);transition:transform .06s linear}
.play .tri{width:0;height:0;margin-left:8px;border-left:30px solid #fff;border-top:19px solid transparent;border-bottom:19px solid transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}

.saved-chip{position:absolute;left:26px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--tx2);
  background:var(--glass);border:1px solid var(--hair);padding:7px 12px;border-radius:100px;backdrop-filter:blur(10px)}

/* ============ FINDING ============ */
#finding{display:grid;place-items:center;background:var(--black)}
.portal{position:relative;width:220px;height:220px;display:grid;place-items:center}
.portal svg{position:absolute;inset:0;transform:rotate(-90deg)}
.portal .self{width:120px;height:120px;border-radius:50%;overflow:hidden;background:var(--char2);border:1px solid var(--hair2);position:relative}
.portal .self video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.portal .self .ph{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 40%,rgba(140,180,255,.3),transparent 70%)}
.finding-txt{position:absolute;bottom:120px;text-align:center;width:100%}
.finding-txt .n{font-size:20px;font-weight:800;letter-spacing:.02em;color:var(--tx)}

/* ============ LIVE ============ */
#live{display:flex;flex-direction:column;background:var(--black)}
.live-top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between}
.pillx{width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--hair);display:grid;place-items:center;color:var(--tx2);cursor:pointer}
.livetag{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.35);border:1px solid var(--hair);border-radius:100px;padding:6px 11px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--tx2)}
.livetag .d{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);animation:pulseDot 1.3s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:.5}50%{opacity:1}}

.stage{flex:1;position:relative;padding:70px 12px 0}
.grid{display:grid;gap:8px;height:100%;grid-auto-rows:1fr}
.grid[data-n="1"]{grid-template-columns:1fr}
.grid[data-n="2"]{grid-template-columns:1fr}
.grid[data-n="3"],.grid[data-n="4"],.grid[data-n="5"],.grid[data-n="6"],.grid[data-n="7"]{grid-template-columns:1fr 1fr}

.tile{position:relative;border-radius:20px;overflow:hidden;background:#0b0c0f;border:1px solid rgba(255,255,255,.06);
  transform:scale(.92);opacity:0;animation:pop .55s var(--spring) forwards}
@keyframes pop{to{transform:none;opacity:1}}
.tile .light{position:absolute;inset:0;background:radial-gradient(58% 55% at var(--lx,42%) var(--ly,36%), hsla(var(--h,210),45%,60%,.34), transparent 72%)}
.tile .spec{position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,var(--spec),transparent)}
.tile .handle{position:absolute;left:12px;bottom:11px;font-size:13px;font-weight:600;color:rgba(255,255,255,.9);text-shadow:0 1px 4px rgba(0,0,0,.5);z-index:3}
.tile .save{position:absolute;right:10px;top:10px;z-index:4;display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,.4);border:1px solid var(--hair2);border-radius:100px;padding:6px 10px;font-size:11px;font-weight:700;color:#fff;opacity:0;transform:translateY(-4px);transition:.35s var(--ease);cursor:pointer;backdrop-filter:blur(8px)}
.tile .save.show{opacity:1;transform:none}
.tile.speaking{box-shadow:inset 0 0 0 2px rgba(156,196,255,.5), 0 0 30px -6px var(--sig-glow)}
.tile.picked{box-shadow:inset 0 0 0 2.5px var(--sig), 0 0 40px -8px var(--sig-glow)}
.tile.win::after{content:"";position:absolute;inset:0;border-radius:20px;box-shadow:inset 0 0 0 2px #fff;animation:winPulse 1.1s var(--ease)}
@keyframes winPulse{0%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 60px 0 var(--sig-glow)}100%{box-shadow:inset 0 0 0 2px rgba(255,255,255,0),0 0 0 0 transparent}}
.tile.leaving{animation:leave .4s var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:scale(.9)}}
.tile video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}

/* self PiP */
.self-pip{position:absolute;right:16px;bottom:16px;width:96px;height:128px;border-radius:16px;overflow:hidden;z-index:25;
  border:1px solid var(--hair2);box-shadow:0 12px 30px -10px #000;background:var(--char2)}
.self-pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.self-pip .ph{position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 40%,rgba(140,180,255,.32),transparent 72%)}
.self-pip .lbl{position:absolute;left:8px;bottom:7px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}

/* game overlay */
.gamewrap{position:absolute;left:0;right:0;bottom:0;z-index:28;padding:0 16px max(env(safe-area-inset-bottom),18px);pointer-events:none}
.gamecard{pointer-events:auto;background:rgba(10,11,13,.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--hair);border-radius:26px;padding:20px;box-shadow:0 -10px 40px -10px #000, inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(16px);opacity:0;animation:slideup .5s var(--ease) forwards}
@keyframes slideup{to{transform:none;opacity:1}}
.gamecard .g-eyebrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.g-name{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sig)}
.g-timer{position:relative;width:22px;height:22px}
.g-prompt{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.14;color:#fff;margin-bottom:16px}
.g-hint{font-size:12.5px;color:var(--tx3);font-weight:600;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--glass);border:1px solid var(--hair);border-radius:16px;padding:15px 16px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;transition:.2s var(--ease);display:flex;align-items:center;justify-content:space-between}
.opt:active{transform:scale(.98)}
.opt.sel{background:var(--glass2);border-color:var(--sig);box-shadow:0 0 24px -8px var(--sig-glow)}
.opt.dim{opacity:.4}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(156,196,255,.14);border-radius:16px;width:0;transition:width .6s var(--ease);z-index:-1}
.opt{position:relative;overflow:hidden;z-index:0}
.thumbs{display:flex;gap:10px}
.thumb{flex:1;background:var(--glass);border:1px solid var(--hair);border-radius:18px;padding:16px;text-align:center;font-size:26px;cursor:pointer;transition:.2s var(--ease)}
.thumb:active{transform:scale(.95)}
.thumb.sel{background:var(--glass2);border-color:var(--sig)}
.reveal-line{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.2;text-wrap:balance}
.reveal-line b{color:var(--sig)}

/* bottom controls */
.controls{display:flex;gap:10px;align-items:center;margin-top:14px}
.next{flex:1;height:54px;border-radius:18px;background:#fff;color:#000;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .3s var(--spring)}
.next:active{transform:scale(.96)}
.react{width:54px;height:54px;border-radius:16px;background:var(--glass);border:1px solid var(--hair);display:grid;place-items:center;font-size:22px;cursor:pointer}
.react:active{transform:scale(.92)}

/* floating reactions */
.fx{position:absolute;z-index:40;pointer-events:none;will-change:transform,opacity}

/* toast */
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);z-index:60;
  background:rgba(20,22,26,.9);backdrop-filter:blur(14px);border:1px solid var(--hair);border-radius:14px;
  padding:12px 18px;font-size:13px;font-weight:600;color:#fff;opacity:0;transition:.35s var(--ease);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* mute */
.mute{width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--hair);display:grid;place-items:center;color:var(--tx2);cursor:pointer;font-size:15px}

/* report sheet */
.sheet-scrim{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(2px)}
.sheet-scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:81;background:var(--char2);border:1px solid var(--hair);border-radius:26px;padding:8px;
  transform:translateY(120%);transition:transform .45s var(--spring)}
.sheet.on{transform:none}
.sheet .row{padding:16px 18px;font-size:16px;font-weight:600;color:#fff;display:flex;align-items:center;gap:12px;border-radius:18px;cursor:pointer}
.sheet .row:active{background:var(--glass)}
.sheet .row.danger{color:var(--live)}
.sheet .row+.row{border-top:1px solid var(--hair)}

@media (prefers-reduced-motion: reduce){
  .play .glow{animation:none} .tile{animation:none;opacity:1;transform:none}
  .gamecard{animation:none;opacity:1;transform:none} .livetag .d{animation:none}
}
</style>

<div class="device" id="device">

  <!-- HOME -->
  <section class="screen on" id="home">
    <div id="selfHome"><div class="grade"></div></div>
    <div class="topbar pad safe-t" style="height:auto">
      <div class="mark">What<b>If</b></div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="livecount"><span class="d"></span><span id="liveN" class="num">12,438</span> live</div>
        <div class="mute" id="mute">♪</div>
      </div>
    </div>
    <div class="home-body safe-b">
      <div class="sub" style="margin-bottom:22px;color:rgba(255,255,255,.8)">press to meet someone</div>
      <div class="play" id="playBtn">
        <div class="glow"></div>
        <div class="disc"><div class="tri"></div></div>
      </div>
      <div class="tiny" style="margin-top:30px;letter-spacing:.15em">YOU NEVER KNOW WHO YOU'LL GET</div>
      <div class="saved-chip safe-b" id="savedChip" style="bottom:22px;opacity:0;transition:.3s">♡ <span id="savedN">0</span> saved</div>
    </div>
  </section>

  <!-- FINDING -->
  <section class="screen" id="finding">
    <div class="portal">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="104" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>
        <circle id="ring" cx="110" cy="110" r="104" fill="none" stroke="var(--sig)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="653" stroke-dashoffset="653" style="filter:drop-shadow(0 0 6px var(--sig-glow))"/>
      </svg>
      <div class="self" id="findSelf"><div class="ph"></div></div>
    </div>
    <div class="finding-txt"><div class="eyebrow" style="margin-bottom:8px">connecting</div><div class="n num" id="findN">2</div></div>
  </section>

  <!-- LIVE -->
  <section class="screen" id="live">
    <div class="live-top pad safe-t">
      <div class="pillx" id="leaveBtn">✕</div>
      <div class="livetag"><span class="d"></span><span id="liveLbl">LIVE · 1:1</span></div>
      <div style="width:38px"></div>
    </div>
    <div class="stage">
      <div class="grid" id="grid" data-n="1"></div>
      <div class="self-pip" id="selfPip"><div class="ph"></div><div class="lbl">you</div></div>
    </div>
    <div class="gamewrap" id="gamewrap"></div>
  </section>

  <!-- report sheet -->
  <div class="sheet-scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="row" id="reportRow">⚑ &nbsp;Report <span id="repWho"></span></div>
    <div class="row danger" id="blockRow">⊘ &nbsp;Block <span id="blkWho"></span></div>
    <div class="row" id="cancelRow" style="justify-content:center;color:var(--tx2)">Cancel</div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const device=$('#device');
let soundOn=true, saved=new Set(), stream=null;

/* ---------- audio ---------- */
let ac=null;
function ensureAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); }
function tone(freq,dur,t0,vol){ if(!ac||!soundOn)return; const o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.connect(g); g.connect(ac.destination);
  const t=ac.currentTime+(t0||0); o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.05,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur+.05); }
function riser(){ if(!ac||!soundOn)return; const o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.connect(g); g.connect(ac.destination);
  const t=ac.currentTime; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(600,t+1.35);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+1.2); g.gain.exponentialRampToValueAtTime(.0001,t+1.6); o.start(t); o.stop(t+1.65); }
function chord(){ tone(523,.5,0,.05); tone(659,.5,.02,.045); tone(784,.6,.04,.04); }
function buzz(p){ if(navigator.vibrate) navigator.vibrate(p); }

/* ---------- camera ---------- */
async function initCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    attachVideo($('#selfHome'), true);
  }catch(e){ /* no camera in sandbox — elegant placeholders stand in */ }
}
function attachVideo(container, isHome){
  if(!stream) return null;
  const v=el('video'); v.autoplay=true; v.muted=true; v.playsInline=true; v.setAttribute('playsinline',''); v.srcObject=stream;
  if(isHome){ container.insertBefore(v, container.firstChild); }
  return v;
}
function selfVideoInto(node){
  node.innerHTML='';
  if(stream){ const v=el('video'); v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=stream; node.appendChild(v); }
  else { const ph=el('div','ph'); node.appendChild(ph); const l=el('div','lbl'); l.textContent='you'; if(node.classList.contains('self-pip'))node.appendChild(l); }
}

/* ---------- data ---------- */
const NAMES=['kai','noor','remy','sasha','theo','luca','emi','dro','wren','max','ira','jae','nova','sol','zed','fin'];
const HUES=[205,212,196,220,190,208,216,200];
let usedNames=[];
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function person(){
  let n; let guard=0; do{ n=pick(NAMES);guard++; }while(usedNames.includes(n)&&guard<20);
  usedNames.push(n); if(usedNames.length>10)usedNames.shift();
  return {name:n, h:pick(HUES), lx:20+Math.random()*50, ly:22+Math.random()*40};
}

/* ---------- games (unpredictable) ---------- */
const GAMES=[
 {id:'point',name:'Point Party',hint:'tap who fits — everyone points at once',
  prompt:()=>pick(['Who woke up 5 minutes ago?','Most likely to start a cult (a fun one)','Who texts their ex at 2am?','Most likely to be a secret genius','Who lies in this game?','Most likely to cry at an ad']),
  kind:'point'},
 {id:'poll',name:'Hot Take',hint:'pick a side',
  prompt:()=>pick([['Pineapple on pizza?','crime','genius'],['Socks in bed?','yes','never'],['Text or call?','text','call'],['Cereal then milk?','right','chaos']]),
  kind:'poll'},
 {id:'thumbs',name:'Confession Cam',hint:'thumbs up = guilty · on 3',
  prompt:()=>pick(['Never have I ever been kicked out of a bar','…ghosted someone mid-conversation','…sent a text to the wrong person','…pretended to be busy to avoid plans']),
  kind:'thumbs'},
 {id:'same',name:'Same Brain',hint:'match the room — pick fast',
  prompt:()=>['Name a fruit',['banana','apple','mango','grape']],
  kind:'same'},
 {id:'freeze',name:'Freeze Face',hint:'hold it — last to laugh wins',
  prompt:()=>'Hold your most SHOCKED face',
  kind:'freeze'},
];

/* ---------- state ---------- */
let cell={people:[],game:null,answered:false};
let idleTimer=null;

/* ---------- screen switch ---------- */
function go(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }

/* ---------- HOME ---------- */
$('#playBtn').onclick=()=>{ ensureAudio(); buzz(18); startFinding(); };
$('#mute').onclick=()=>{ soundOn=!soundOn; $('#mute').textContent=soundOn?'♪':'✕'; $('#mute').style.color=soundOn?'':'var(--tx3)'; };
function refreshSaved(){ $('#savedN').textContent=saved.size; $('#savedChip').style.opacity=saved.size?'1':'0'; }

/* live counter drift */
let liveN=12438; setInterval(()=>{ liveN+=Math.floor((Math.random()-0.3)*7); $('#liveN').textContent=liveN.toLocaleString(); },1600);

/* ---------- FINDING (the held breath) ---------- */
function startFinding(){
  go('finding'); selfVideoInto($('#findSelf'));
  riser(); buzz([0,120,30,120,40,140]);
  const ring=$('#ring'), C=653, dur=1500, t0=performance.now(); const numEl=$('#findN'); numEl.textContent='2'; let flipped=false;
  function fr(now){
    const t=Math.min(1,(now-t0)/dur);
    ring.style.strokeDashoffset=C*(1-t);
    if(t>0.5&&!flipped){ flipped=true; numEl.textContent='1'; numEl.animate([{transform:'scale(1.3)',opacity:.6},{transform:'scale(1)',opacity:1}],{duration:300,easing:'ease-out'}); buzz(40); }
    if(t<1) requestAnimationFrame(fr); else drop();
  }
  requestAnimationFrame(fr);
}

/* ---------- DROP into a live cell ---------- */
function drop(){
  // unpredictable group size + game
  const size=pick([1,1,1,2,2,3,3,5]);        // weighted toward small, occasional crowd
  cell.people=Array.from({length:size},()=>person());
  cell.game=pick(GAMES); cell.answered=false;
  go('live'); chord(); buzz([0,30,20,60]);
  $('#liveLbl').textContent = size===1?'LIVE · 1:1':'LIVE · '+(size+1)+' people';
  const grid=$('#grid'); grid.innerHTML=''; grid.dataset.n=String(size);
  cell.people.forEach((p,i)=>{ grid.appendChild(makeTile(p,i)); });
  selfVideoInto($('#selfPip'));
  // speaking life
  startSpeaking();
  // start the game after the faces land
  clearTimeout(idleTimer);
  setTimeout(runGame, 650);
}
function makeTile(p,i){
  const t=el('div','tile'); t.style.setProperty('--h',p.h); t.style.setProperty('--lx',p.lx+'%'); t.style.setProperty('--ly',p.ly+'%');
  t.style.animationDelay=(i*70)+'ms'; t.dataset.name=p.name;
  t.innerHTML=`<div class="light"></div><div class="spec"></div><div class="handle">@${p.name}</div>`;
  // long-press → report
  let lp; t.addEventListener('pointerdown',()=>{ lp=setTimeout(()=>openSheet(p.name),480); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>t.addEventListener(ev,()=>clearTimeout(lp)));
  return t;
}
let speakTimer=null;
function startSpeaking(){
  clearInterval(speakTimer);
  speakTimer=setInterval(()=>{
    const tiles=[...document.querySelectorAll('#grid .tile')];
    tiles.forEach(t=>t.classList.remove('speaking'));
    if(tiles.length) pick(tiles).classList.add('speaking');
  },1200);
}

/* ---------- GAMES ---------- */
function runGame(){
  const g=cell.game, wrap=$('#gamewrap'); cell.answered=false;
  const card=el('div','gamecard');
  let inner=`<div class="g-eyebrow"><div class="g-name">${g.name}</div>
     <svg class="g-timer" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2"/>
     <circle id="gt" cx="11" cy="11" r="9" fill="none" stroke="var(--sig)" stroke-width="2" stroke-linecap="round" stroke-dasharray="57" stroke-dashoffset="0" transform="rotate(-90 11 11)"/></svg></div>`;

  if(g.kind==='point'){
    inner+=`<div class="g-prompt">${g.prompt()}</div><div class="g-hint">${g.hint}</div>`;
    card.innerHTML=inner; wrap.innerHTML=''; wrap.appendChild(card);
    // tap a tile to point
    const tiles=[...document.querySelectorAll('#grid .tile')];
    const onPick=(t)=>{ if(cell.answered)return; cell.answered=true; buzz(20); tiles.forEach(x=>x.onclick=null);
      const target=pick(tiles); tiles.forEach(x=>x.classList.toggle('picked',x===t));
      setTimeout(()=>{ tiles.forEach(x=>x.classList.remove('picked')); target.classList.add('win','picked');
        revealLine(`the room pointed at <b>@${target.dataset.name}</b>`, target.dataset.name); chord(); buzz([0,40,40,60]); },900); };
    tiles.forEach(t=>t.onclick=()=>onPick(t));
    startTimer(9,()=>{ if(!cell.answered && tiles.length) onPick(pick(tiles)); });
  }
  else if(g.kind==='poll'){
    const p=g.prompt();
    inner+=`<div class="g-prompt">${p[0]}</div><div class="opts"><div class="opt" data-i="0"><span class="bar"></span>${p[1]}</div><div class="opt" data-i="1"><span class="bar"></span>${p[2]}</div></div>`;
    card.innerHTML=inner; wrap.innerHTML=''; wrap.appendChild(card);
    const opts=[...card.querySelectorAll('.opt')];
    opts.forEach(o=>o.onclick=()=>{ if(cell.answered)return; cell.answered=true; buzz(20);
      const a=40+Math.floor(Math.random()*30), split=[a,100-a]; const mine=+o.dataset.i;
      opts.forEach((x,i)=>{ x.classList.toggle('sel',i===mine); x.querySelector('.bar').style.width=split[i]+'%'; x.innerHTML+=` <span style="color:var(--tx3);font-weight:700">${split[i]}%</span>`; });
      setTimeout(()=>revealLine(`the room split <b>${split[mine]}%</b> your way`),700); chord(); });
    startTimer(9,()=>{ if(!cell.answered) opts[0].click(); });
  }
  else if(g.kind==='thumbs'){
    inner+=`<div class="g-prompt">${g.prompt()}</div><div class="g-hint">${g.hint}</div><div class="thumbs"><div class="thumb" data-v="1">👍</div><div class="thumb" data-v="0">👎</div></div>`;
    card.innerHTML=inner; wrap.innerHTML=''; wrap.appendChild(card);
    const th=[...card.querySelectorAll('.thumb')];
    th.forEach(t=>t.onclick=()=>{ if(cell.answered)return; cell.answered=true; buzz(24); th.forEach(x=>x.classList.toggle('sel',x===t));
      const guilty=1+Math.floor(Math.random()*(cell.people.length+1));
      setTimeout(()=>revealLine(`<b>${guilty}</b> in the room are guilty 👀`),700); chord(); });
    startTimer(8,()=>{ if(!cell.answered) th[0].click(); });
  }
  else if(g.kind==='same'){
    const p=g.prompt();
    inner+=`<div class="g-prompt">${p[0]}</div><div class="opts">${p[1].map((o,i)=>`<div class="opt" data-i="${i}">${o}</div>`).join('')}</div>`;
    card.innerHTML=inner; wrap.innerHTML=''; wrap.appendChild(card);
    const opts=[...card.querySelectorAll('.opt')];
    opts.forEach(o=>o.onclick=()=>{ if(cell.answered)return; cell.answered=true; buzz(20); opts.forEach(x=>x.classList.toggle('sel',x===o));
      const m=Math.floor(Math.random()*(cell.people.length+1));
      setTimeout(()=>revealLine(m>0?`<b>${m}</b> of you said the same thing 🧠`:`nobody matched you — iconic`),700); chord(); });
    startTimer(8,()=>{ if(!cell.answered) opts[0].click(); });
  }
  else if(g.kind==='freeze'){
    inner+=`<div class="g-prompt">${g.prompt()}</div><div class="g-hint">${g.hint}</div>`;
    card.innerHTML=inner; wrap.innerHTML=''; wrap.appendChild(card);
    startTimer(5,()=>{ if(cell.answered)return; cell.answered=true; const survived=Math.random()>0.5;
      revealLine(survived?`you held it 😐 <b>ice cold</b>`:`you cracked 😂 <b>@${cell.people[0].name}</b> won`); chord(); buzz([0,40,40,60]); });
  }
}
let gtRAF=null;
function startTimer(sec,done){
  const gt=$('#gt'); if(!gt){ setTimeout(done,sec*1000); return; }
  const C=57,t0=performance.now(); cancelAnimationFrame(gtRAF);
  function fr(now){ const t=Math.min(1,(now-t0)/(sec*1000)); gt.style.strokeDashoffset=C*t;
    if(t<1&&!cell.answered) gtRAF=requestAnimationFrame(fr); else if(!cell.answered) done(); }
  gtRAF=requestAnimationFrame(fr);
}

/* reveal → show NEXT + reconnect */
function revealLine(html, saveName){
  const wrap=$('#gamewrap'); const card=el('div','gamecard');
  card.innerHTML=`<div class="reveal-line">${html}</div>
    <div class="controls">
      <div class="react" id="reactBtn">😂</div>
      <div class="next" id="nextBtn">Next <span style="opacity:.5">›</span></div>
    </div>`;
  wrap.innerHTML=''; wrap.appendChild(card);
  $('#nextBtn').onclick=()=>{ clearTimeout(idleTimer); buzz(16); startFinding(); };
  $('#reactBtn').onclick=()=>{ buzz(8); floatFx('😂'); };
  // reconnect: offer to save a stand-out person
  const name=saveName||pick(cell.people).name;
  const tile=[...document.querySelectorAll('#grid .tile')].find(t=>t.dataset.name===name);
  if(tile && !tile.querySelector('.save')){
    const s=el('div','save'); s.innerHTML='♡ save'; tile.appendChild(s);
    requestAnimationFrame(()=>s.classList.add('show'));
    s.onclick=(e)=>{ e.stopPropagation(); saved.add(name); refreshSaved(); s.innerHTML='✓ saved'; s.style.borderColor='var(--sig)';
      showToast(`saved @${name} — you'll know when they're live`); buzz(20); };
  }
  // involuntary recompose if idle (feel the loop pull)
  clearTimeout(idleTimer); idleTimer=setTimeout(()=>{ if($('#live').classList.contains('on')) startFinding(); }, 7000);
}

/* ---------- reactions ---------- */
function floatFx(e){
  const d=device.getBoundingClientRect(); const f=el('div','fx'); f.textContent=e; f.style.fontSize=(26+Math.random()*14)+'px';
  const x=.5+(Math.random()-.5)*.4; f.style.left=(x*d.width)+'px'; f.style.bottom='150px'; device.appendChild(f);
  f.animate([{transform:'translateY(0) scale(.6)',opacity:0},{transform:'translateY(-30px) scale(1)',opacity:1,offset:.2},{transform:`translateY(-${d.height*.5}px) scale(1)`,opacity:0}],{duration:1700,easing:'ease-out'}).onfinish=()=>f.remove();
}

/* ---------- leave / report ---------- */
$('#leaveBtn').onclick=()=>{ clearTimeout(idleTimer); clearInterval(speakTimer); buzz(12); go('home'); };
function openSheet(name){ buzz(20); $('#repWho').textContent='@'+name; $('#blkWho').textContent='@'+name; $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#scrim').onclick=closeSheet; $('#cancelRow').onclick=closeSheet;
$('#reportRow').onclick=()=>{ closeSheet(); showToast('reported — our team is on it'); };
$('#blockRow').onclick=()=>{ closeSheet(); showToast('blocked — you won\'t see them again'); buzz(20); startFinding(); };

/* ---------- toast ---------- */
let toastT=null;
function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

/* ---------- go ---------- */
initCamera();
refreshSaved();
</script>
