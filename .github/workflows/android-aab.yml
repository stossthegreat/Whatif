name: Build Flutter AAB — Play release

# The Play Store artifact. Produces android app bundle signed with your upload
# key, ready to drop into Play Console.
#
# ── ONE-TIME SETUP (GitHub → Settings → Secrets and variables → Actions) ──
#
# Unlike the other repos, this app does NOT keep its keystore in git. That is
# deliberate: a committed .jks plus passwords in a YAML file means anyone who
# can read the repo can sign builds as you, and this repo is public. The
# signing material lives in Actions secrets instead, and Gradle already knows
# how to read it — android/app/build.gradle.kts looks for android/key.properties,
# which the "Prepare signing" step below writes at build time and never commits.
#
# Add these four secrets:
#
#   ANDROID_KEYSTORE_BASE64    base64 of your upload-keystore.jks
#   ANDROID_KEY_ALIAS          the alias inside that keystore
#   ANDROID_KEY_PASSWORD       the key password
#   ANDROID_KEYSTORE_PASSWORD  the store password
#
# To produce the first one on a Mac:
#     base64 -i upload-keystore.jks | pbcopy
# on Linux:
#     base64 -w0 upload-keystore.jks
#
# With no secrets set the workflow still runs and still produces a bundle —
# Gradle falls back to debug signing. Play refuses that bundle, which is the
# right outcome: it means you get a clear "wrong signature" error rather than a
# silently unsigned release.
#
# NOTE ON BUILD NUMBERS: this does NOT pass --build-number. Play requires a
# strictly increasing versionCode, and pubspec.yaml is already at +97, so a run
# number would move it backwards. Bump `version:` in pubspec.yaml per release.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          mkdir -p android
          FLUTTER_SDK=$(dirname "$(dirname "$(which flutter)")")
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Android SDK 36 + licenses
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" > /dev/null

      - name: Prepare signing
        # Writes the keystore and android/key.properties from secrets. Both are
        # build-time only and neither is ever committed (.gitignore covers them).
        # Passwords go in through $GITHUB_ENV-free heredocs so they never appear
        # in a command line that the log could echo.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this bundle will be DEBUG-SIGNED and Play will reject it. See the header of this workflow file."
            exit 0
          fi
          KS="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"

          # storeFile is absolute on purpose: file() inside the :app module
          # resolves relative paths against android/app, which is easy to get
          # subtly wrong and produces a confusing "keystore not found".
          umask 077
          {
            echo "storeFile=$KS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > "$GITHUB_WORKSPACE/android/key.properties"

          echo "Keystore fingerprints (check these match Play Console):"
          keytool -list -v -keystore "$KS" -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

      - name: Precache Flutter engine
        run: flutter precache --android --force

      - name: flutter pub get
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify 16 KB page size support
        # Fails the build rather than warning. A plugin bump can reintroduce a
        # 4 KB-aligned .so with no other symptom, and Play would reject the
        # upload — better to find out here. See docs/PLAY_COMPLIANCE.md.
        run: python3 tool/check_16kb.py build/app/outputs/bundle/release/app-release.aab

      - name: Confirm signing
        # A debug-signed bundle is a wasted Play upload. Say so loudly, in the
        # run summary, instead of leaving it to be discovered in Play Console.
        run: |
          if [ -f android/key.properties ]; then
            echo "Signed with the upload key from Actions secrets." >> $GITHUB_STEP_SUMMARY
          else
            echo "**DEBUG-SIGNED — Play will reject this bundle.** Add the signing secrets listed at the top of .github/workflows/android-aab.yml." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$(grep '^version:' pubspec.yaml | cut -d' ' -f2)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rivler-release-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
