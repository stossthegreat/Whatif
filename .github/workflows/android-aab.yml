name: Build Flutter AAB — Play release

# The Play Store artifact. Produces the release-signed Android App Bundle you
# upload to Play Console.
#
# NOTHING TO CONFIGURE. No GitHub secrets, no dashboards. The upload key lives
# in the repo, same as the other Rivler app repos:
#
#     android/app/upload-keystore.jks   the key
#     android/app/build.gradle.kts      its alias and passwords, at the top
#
# Commit those and every build from here on is signed correctly, on any machine
# and in any CI. The one-time setup is written out at the top of
# android/app/build.gradle.kts.
#
# WHY THE BUILD MIGHT SAY "DEBUG MODE": when Gradle can't find a release key it
# falls back to the debug keystore, and Play answers that upload with "You
# uploaded an APK or Android App Bundle that was signed in debug mode." So this
# workflow checks for the keystore in step one and stops there if it's missing,
# rather than spending twenty minutes making a bundle you can't upload.
#
# NOTE ON BUILD NUMBERS: this does NOT pass --build-number. Play requires a
# strictly increasing versionCode and pubspec.yaml is already at +99, so a run
# number would move it backwards. Bump `version:` in pubspec.yaml per release.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

    steps:
      - uses: actions/checkout@v4

      - name: Verify keystore
        # First step on purpose — everything after this is expensive.
        run: |
          set -e
          KS=android/app/upload-keystore.jks

          # The keystore's own credentials. They live HERE, in the workflow,
          # and are handed to Gradle through $GITHUB_ENV further down — the
          # same way the other Rivler app repos do it. android/app/
          # build.gradle.kts reads KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD
          # from the environment before anything else, so this is the only
          # place they need to exist.
          #
          # Set these three to whatever the keystore at $KS actually uses, or
          # keytool below fails with "keystore password was incorrect".
          KEY_ALIAS=REPLACE_ME
          STORE_PASSWORD=REPLACE_ME
          KEY_PASSWORD=REPLACE_ME

          # Rivler's fingerprints as recorded against Play Console.
          EXPECT_SHA1="FA:D0:02:93:84:20:93:CB:12:9D:2D:FD:75:4B:DC:BF:13:FF:07:F9"
          EXPECT_SHA256="52:43:75:AF:A8:4F:4A:1A:08:05:7A:09:67:8F:54:88:5F:53:DB:F1:AE:D3:50:41:98:DA:63:BF:5B:4E:A1:CC"

          echo "================================================================"
          echo " EXPECTED FINGERPRINTS (registered with Play Console for Rivler)"
          echo "================================================================"
          echo "         SHA1: $EXPECT_SHA1"
          echo "         SHA256: $EXPECT_SHA256"
          echo "================================================================"
          echo ""

          if [ ! -f "$KS" ]; then
            echo "::error::$KS is missing, so this build could only be debug-signed and Play would reject it with 'signed in debug mode'."
            echo "Put Rivler's upload keystore at $KS and commit it."
            echo "android/.gitignore already whitelists that exact path."
            exit 1
          fi

          if [ "$KEY_ALIAS" = "REPLACE_ME" ]; then
            echo "::error::The three credential lines at the top of this workflow are still REPLACE_ME."
            echo "Set KEY_ALIAS, STORE_PASSWORD and KEY_PASSWORD to the values $KS actually uses."
            echo "To read the alias off it: keytool -list -v -keystore $KS"
            exit 1
          fi

          echo "Using keystore from repo: $KS"
          ls -l "$KS"
          echo ""
          echo "Actual fingerprints from keystore:"
          keytool -list -v -keystore "$KS" -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

          # Hand the credentials to Gradle. android/app/build.gradle.kts reads
          # KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD from the environment
          # before anything else, so they live here in the workflow and the
          # Gradle file keeps its placeholders.
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

          ACTUAL_SHA1=$(keytool -list -v -keystore "$KS" -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            | grep -m1 'SHA1:' | sed 's/.*SHA1: *//')

          # A warning, not a gate. If the expected values above turn out to be
          # the APP SIGNING key — the one Google holds under Play App Signing —
          # rather than the upload key, a mismatch here is normal and must not
          # block the build. Play is the authority; this is an early heads-up.
          if [ "$ACTUAL_SHA1" != "$EXPECT_SHA1" ]; then
            echo "::warning::Keystore does NOT match the fingerprint recorded above. If Rivler is already on Play under a different upload key, this bundle will be rejected. Check Play Console > Test and release > App integrity > App signing."
          else
            echo "Fingerprints match the recorded upload key."
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          mkdir -p android
          FLUTTER_SDK=$(dirname "$(dirname "$(which flutter)")")
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Android SDK 36 + licenses
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" > /dev/null

      - name: Precache Flutter engine
        run: flutter precache --android --force

      - name: flutter pub get
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify 16 KB page size support
        # Fails the build rather than warning. A plugin bump can reintroduce a
        # 4 KB-aligned .so with no other symptom, and Play would reject the
        # upload. See docs/PLAY_COMPLIANCE.md.
        run: python3 tool/check_16kb.py build/app/outputs/bundle/release/app-release.aab

      - name: Build summary
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          echo "Signed with the upload key from the repo." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$(grep '^version:' pubspec.yaml | cut -d' ' -f2)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(du -h $AAB | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rivler-release-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
