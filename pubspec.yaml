name: rivlr
description: "Rivler — a live social platform. Press one button, meet someone new."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+101

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Live self-view (simulated mode). Fail-soft: if the camera is unavailable or
  # denied, every screen falls back to an elegant placeholder.
  camera: ^0.11.0+2

  # Real matchmaking (pure Dart WebSocket) — used only when WHATIF_BACKEND is set.
  web_socket_channel: ^3.0.1

  # Live group video (LiveKit). Only used in live mode (RIVLR_BACKEND set);
  # in simulated builds the code is present but never invoked.
  #
  # PINNED EXACTLY, and this pin is COUPLED TO THE FLUTTER VERSION. Three
  # constraints define it, and two of them were found the hard way — one by
  # GitHub Actions, one by the Codemagic iOS build:
  #
  #  1. 16 KB page sizes (Google Play, blocks updates from 1 Feb 2027).
  #     LiveKit pulls in flutter_webrtc, which ships libwebrtc.so.
  #     flutter_webrtc only builds it with 16 KB ELF alignment from 1.2.0, and
  #     livekit_client picks that up from 2.5.1. Older is non-compliant no
  #     matter what Gradle says — the misalignment is inside the prebuilt .so.
  #
  #  2. livekit_client <= 2.6.4 DOES NOT COMPILE on Dart 3.10+. Its own
  #     local.dart reads `publishOptions.videoCodec` on a nullable that can no
  #     longer be promoted across an await. Fine on Flutter 3.35.6, a hard
  #     kernel_snapshot failure on the newer Flutter that Codemagic uses.
  #
  #  3. livekit_client >= 2.6.5 requires meta ^1.17.0, and flutter_test pins
  #     meta from the SDK: 1.16.0 up to Flutter 3.35.x, 1.17.0 from 3.38.0.
  #     So anything at or above 2.6.5 needs FLUTTER >= 3.38.0.
  #
  # (2) and (3) point opposite ways and leave no version that works on
  # Flutter 3.35.6. The only resolution is to move up: 2.11.0 on Flutter
  # 3.38.0 or newer, which is what .github/workflows/*.yml now pin and what
  # Codemagic already uses. Dropping the Flutter version below 3.38.0 breaks
  # this pin; there is no safe LiveKit version below it.
  #
  # ALSO: flutter_webrtc 1.6.0's Android library is compiled against API 36,
  # which is why android/app/build.gradle.kts must stay at compileSdk 36.
  #
  # widgets/video_view.dart depends on the renderer's fit API, which is
  # VideoViewFit from 2.5 onward (it was flutter_webrtc's RTCVideoViewObjectFit
  # up to 2.4.x). Re-read that file before moving this pin.
  livekit_client: 2.11.0

  # Keep the screen awake while finding / live (a live video app must never sleep).
  wakelock_plus: ^1.2.5

  # Remember you're signed in / onboarded, so a cold start goes straight to Home.
  shared_preferences: ^2.3.2

  # Tiny generated sound effects (ticks, thunks, fanfare) — addiction is 40% audio.
  audioplayers: ^6.1.0

  # Real share-card export: render the Moment card to a PNG and hand it to the
  # native share sheet. This is the growth loop.
  share_plus: ^10.1.0
  path_provider: ^2.1.4

  # Deep links: rivlr://join/CODE opens the app straight into a friend's room.
  app_links: ^6.3.0

  # Camera/mic permission asked at the priming screen (at intent), not cold
  # mid-match — and lets us detect a permanent denial and route to Settings.
  permission_handler: ^11.3.1

  # Social layer media: profile photos + photo messages (library picker),
  # voice notes (recorder), HTTP uploads to the server's media API.
  image_picker: ^1.1.2
  # Any-size photos: full-res picks run through a compression ladder down to
  # the server's 1MB cap (also converts iOS HEIC to JPEG).
  flutter_image_compress: ^2.4.0
  record: ^6.2.0
  http: ^1.2.2

  # Sign in with Apple — identity that survives reinstalls. The Apple user id
  # becomes the stable uid, so sparks and mutuals come back with the account.
  sign_in_with_apple: ^6.1.3
  google_sign_in: ^6.3.0

  # Rivler+ subscriptions. RevenueCat owns receipt validation, renewals,
  # cancellations and refunds; our server asks it who's entitled and is the
  # only thing the app trusts. Dormant until a key lands in
  # lib/revenuecat_config.dart.
  # 10.9.1 bundles purchases-android 10.17.0, which uses Google Play Billing
  # Library 8.3.0 — the version Play requires for new apps and updates from
  # 31 Aug 2026. See docs/PLAY_COMPLIANCE.md before touching this.
  purchases_flutter: ^10.9.1

  # Push — "your person is live". Token goes to the server; sends need the
  # APNs key uploaded in Firebase console + service account on Railway.
  firebase_messaging: ^15.1.0

  # Analytics — see exactly what people use (screens, modes, games, sparks).
  # Dormant until real keys land in lib/firebase_config.dart; every call
  # no-ops when unconfigured.
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sfx/

  # Display face — Righteous (OFL, single weight). The brand voice: rounded
  # techno display for headers, wordmark, big numbers, names — deliberately
  # NOT a condensed-caps face (that's every other live app). Body text stays
  # the platform font.
  fonts:
    - family: Righteous
      fonts:
        - asset: assets/fonts/Righteous-Regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
