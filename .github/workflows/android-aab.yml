name: Build Flutter AAB — Play release

# The Play Store artifact. Produces the release-signed Android App Bundle you
# upload to Play Console.
#
# NOTHING TO CONFIGURE. No GitHub secrets, no dashboards. The upload key lives
# in the repo, same as the other Rivler app repos:
#
#     android/app/upload-keystore.jks   the key
#     android/app/build.gradle.kts      its alias and passwords, at the top
#
# Commit those and every build from here on is signed correctly, on any machine
# and in any CI. The one-time setup is written out at the top of
# android/app/build.gradle.kts.
#
# WHY THE BUILD MIGHT SAY "DEBUG MODE": when Gradle can't find a release key it
# falls back to the debug keystore, and Play answers that upload with "You
# uploaded an APK or Android App Bundle that was signed in debug mode." So this
# workflow checks for the keystore in step one and stops there if it's missing,
# rather than spending twenty minutes making a bundle you can't upload.
#
# NOTE ON BUILD NUMBERS: this does NOT pass --build-number. Play requires a
# strictly increasing versionCode and pubspec.yaml is already at +99, so a run
# number would move it backwards. Bump `version:` in pubspec.yaml per release.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

    steps:
      - uses: actions/checkout@v4

      - name: Verify keystore
        # First step on purpose — everything after this is expensive.
        run: |
          set -e
          KS=android/app/upload-keystore.jks
          GRADLE=android/app/build.gradle.kts

          if [ ! -f "$KS" ]; then
            echo "::error::$KS is missing, so this build could only be debug-signed and Play would reject it with 'signed in debug mode'."
            echo "Copy Rivler's upload keystore to $KS and commit it."
            echo "Full one-time setup is at the top of $GRADLE."
            exit 1
          fi

          if grep -q 'REPLACE_ME' "$GRADLE"; then
            echo "::error::$GRADLE still has its REPLACE_ME placeholders."
            echo "Set keyAliasValue, keyPasswordValue and storePasswordValue to the keystore's real values, then commit."
            echo "To read them off the keystore: keytool -list -v -keystore $KS"
            exit 1
          fi

          ALIAS=$(grep '^val keyAliasValue' "$GRADLE" | sed 's/.*?: "\(.*\)".*/\1/')
          STOREPASS=$(grep '^val storePasswordValue' "$GRADLE" | sed 's/.*?: "\(.*\)".*/\1/')
          echo "Keystore fingerprints — these must match Play Console:"
          keytool -list -v -keystore "$KS" -alias "$ALIAS" \
            -storepass "$STOREPASS" | grep -E "SHA1:|SHA256:"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          mkdir -p android
          FLUTTER_SDK=$(dirname "$(dirname "$(which flutter)")")
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Android SDK 36 + licenses
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" > /dev/null

      - name: Precache Flutter engine
        run: flutter precache --android --force

      - name: flutter pub get
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify 16 KB page size support
        # Fails the build rather than warning. A plugin bump can reintroduce a
        # 4 KB-aligned .so with no other symptom, and Play would reject the
        # upload. See docs/PLAY_COMPLIANCE.md.
        run: python3 tool/check_16kb.py build/app/outputs/bundle/release/app-release.aab

      - name: Build summary
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          echo "Signed with the upload key from the repo." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$(grep '^version:' pubspec.yaml | cut -d' ' -f2)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(du -h $AAB | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rivler-release-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
